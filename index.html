<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="郑东明(Guanchen)的个人主页。专注于网站搭建与技术支持、AI私有化部署、海外业务运营与广告投放的一站式技术与营销解决方案。">
    <meta name="keywords" content="郑东明, Guanchen, 网站搭建, AI部署, 海外运营, 广告投放, 技术支持">
    <meta name="author" content="郑东明 Guanchen">
    <meta property="og:title" content="郑东明 Guanchen - 技术与营销解决方案专家">
    <meta property="og:description" content="专注于提供一站式技术与营销解决方案：网站技术、AI私有化部署、海外业务与广告。">
    <meta property="og:image" content="https://www.dmpage.com/pic/home-dmpage.jpg">
    <meta property="og:url" content="https://www.dmpage.com/">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👋</text></svg>">
    <title>郑东明 Guanchen - 技术与营销解决方案专家</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        h1 {
            margin: 0;
            font-size: 2.2em;
            color: #111827;
        }
        .subtitle {
            color: var(--primary-color);
            font-weight: 600;
            margin-top: 8px;
            font-size: 1.1em;
        }
        .intro {
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.05em;
            color: var(--text-muted);
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .service-card {
            background: #f8fafc;
            padding: 24px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #cbd5e1;
        }
        .service-card h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .service-card p {
            margin: 0;
            font-size: 0.95em;
            color: var(--text-muted);
        }
        .card-section {
            margin-top: 50px;
            text-align: center;
        }
        .card-section h3 {
            color: #1f2937;
            margin-bottom: 20px;
        }
        .card-section img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .card-section img:hover {
            transform: scale(1.02);
        }
        footer {
            margin-top: 50px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9em;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            body { padding: 20px 10px; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>郑东明 (Guanchen)</h1>
            <div class="subtitle">技术与营销解决方案专家</div>
        </header>
        
        <section class="intro">
            <p>您好！欢迎来到我的个人主页。</p>
            <p>我致力于通过技术创新和数据驱动，帮助企业实现数字化转型与业务增长。</p>
        </section>

        <section class="services">
            <div class="service-card">
                <h3>💻 网站与技术支持</h3>
                <p>全栈网站搭建、系统运维与持续的技术保障支持。</p>
            </div>
            <div class="service-card">
                <h3>🤖 AI 私有化部署</h3>
                <p>量身定制的 AI 大模型私有化部署与业务集成方案。</p>
            </div>
            <div class="service-card">
                <h3>🌍 海外业务与广告</h3>
                <p>助力出海，提供精准的广告投放与海外业务运营指导。</p>
            </div>
        </section>

        <section class="card-section">
            <h3>👇 详细业务与联系方式</h3>
            <img src="pic/home-dmpage.jpg" alt="郑东明 Guanchen 的联系名片" loading="lazy" decoding="async">
        </section>

        <footer>
            <p>&copy; 2026 郑东明 Guanchen. All Rights Reserved.</p>
        </footer>
    </main>
</body>
</html>
